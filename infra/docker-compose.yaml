name: app-infra

services:
    db:
        image: docker.io/library/postgres:18.6-alpine
        restart: always
        ports:
            - "5432:5432"
        volumes:
            - ../.local/db:/var/lib/postgresql:rw
        environment:
            POSTGRES_DB: "app"
            POSTGRES_USER: "app"
            POSTGRES_PASSWORD: "development"
